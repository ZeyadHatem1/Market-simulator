name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (editable, with native matching engine extension)
        run: |
          python -m pip install --upgrade pip
          pip install "pybind11>=2.11"
          pip install -e ".[dev]" --no-build-isolation

      - name: Run tests (pure-Python + native differential)
        run: pytest -v

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (pylint)
        run: pylint src/market_sim --fail-under=9.5
