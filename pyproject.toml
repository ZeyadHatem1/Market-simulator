[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sim"
version = "0.1.0"
description = "Event driven synthetic financial market simulation engine."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "plotly",
    "sortedcontainers",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "pylint",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]